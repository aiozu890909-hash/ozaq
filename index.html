<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OZAQ — mock testlar va analitika</title>
<meta name="theme-color" content="#0B6B4F">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('ozaq_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--bg:#0A0F0D;--card:#141D18;--card2:#19241E;--inp:#0F1713;--line:#24322B;--fg:#EAF2EE;--mut:#8FA19A;--pri:#0B6B4F;--pri2:#0F8F68;--hi:#5CFFB0;--soft:#0F3A2C;--err:#FF8A8A;--warn:#F5C451;--warnbg:#2B2410;--glass:rgba(10,15,13,.78);--sh:0 10px 34px rgba(0,0,0,.38)}
:root[data-theme=light]{--bg:#F2F6F4;--card:#FFFFFF;--card2:#F6FAF8;--inp:#F6FAF8;--line:#DCE6E1;--fg:#12201A;--mut:#5A6D65;--hi:#0B6B4F;--soft:#DDF5EA;--err:#C0392B;--warn:#8A5F00;--warnbg:#FFF6DA;--glass:rgba(255,255,255,.82);--sh:0 10px 34px rgba(20,50,38,.10)}
@media(prefers-color-scheme:light){:root:not([data-theme]){--bg:#F2F6F4;--card:#FFFFFF;--card2:#F6FAF8;--inp:#F6FAF8;--line:#DCE6E1;--fg:#12201A;--mut:#5A6D65;--hi:#0B6B4F;--soft:#DDF5EA;--err:#C0392B;--warn:#8A5F00;--warnbg:#FFF6DA;--glass:rgba(255,255,255,.82);--sh:0 10px 34px rgba(20,50,38,.10)}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--hi)}h1,h2,h3{letter-spacing:-.01em}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}.mut{color:var(--mut)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.logo{font-weight:800;font-size:20px;letter-spacing:.04em}.logo i{color:var(--hi);font-style:normal}
.mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--hi));display:inline-block;box-shadow:0 4px 14px rgba(92,255,176,.25)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--fg)}
.bar{display:flex;align-items:center;gap:10px;padding:0 20px;height:62px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.navs{display:flex;gap:4px;margin-left:14px}.nav{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:500}.nav:hover{background:var(--card2);color:var(--fg)}.nav.on{background:var(--soft);color:var(--hi)}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--mut)}.ibtn:hover{color:var(--fg);border-color:var(--pri)}
.chip{display:flex;align-items:center;gap:8px}.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.lang{width:auto;padding:6px 8px;font-size:12px;font-weight:600;border-radius:9px}
.pill,.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--hi)}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-draft{background:rgba(125,150,255,.14);color:#8FA6FF}.b-published{background:var(--warnbg);color:var(--warn)}.b-closed{background:rgba(255,120,120,.14);color:var(--err)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 1px 0 rgba(255,255,255,.02)}.card h3{margin:0 0 12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}.kpis .card{margin:0;display:flex;gap:14px;align-items:center}
.kic{width:46px;height:46px;border-radius:13px;background:var(--soft);color:var(--hi);display:grid;place-items:center;flex:none}.kic svg{width:22px;height:22px}.kpis b{font-size:26px;line-height:1.1;display:block}.kpis .mut{font-size:12px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.head h2{margin:0;font-size:24px}
label{display:block;font-size:12px;font-weight:500;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--inp)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri2);box-shadow:0 0 0 3px rgba(15,143,104,.25)}input[type=radio],input[type=checkbox]{width:auto;accent-color:var(--pri)}input.num{width:74px}textarea{min-height:110px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(11,107,79,.35);transition:transform .12s,box-shadow .12s;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(11,107,79,.4)}.btn:active{transform:none}.btn.s{padding:6px 11px;font-size:12px;font-weight:600;background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}.btn.s:hover{background:var(--card2);border-color:var(--pri)}
.btn.w{width:100%;margin-top:16px;padding:12px}.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:11px 10px;border-bottom:1px solid var(--line)}tbody tr:hover td{background:var(--card2)}tbody tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}.empty{text-align:center;padding:34px 12px;color:var(--mut)}.empty .kic{margin:0 auto 10px;width:54px;height:54px}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:13px;margin:6px 0 18px;max-width:100%;overflow-x:auto}.tabs button{padding:8px 14px;border:0;border-radius:10px;background:transparent;color:var(--mut);font-weight:600;white-space:nowrap}.tabs .on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.ti{font-size:20px;font-weight:800;max-width:440px;background:transparent;border-color:transparent;padding:6px 8px}.ti:hover,.ti:focus{background:var(--inp);border-color:var(--line)}
.note{padding:10px 14px;border-radius:12px;background:var(--warnbg);color:var(--warn);margin-bottom:14px;font-size:13px}
.tool{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:14px;position:sticky;top:70px;z-index:5}
.paper{background:#fff;color:#14201b;max-width:794px;min-height:220px;margin:0 auto 22px;padding:40px 48px;border-radius:6px;box-shadow:var(--sh);outline:0;line-height:1.6}
.rt table{border-collapse:collapse;margin:8px 0}.rt td,.rt th{border:1px solid #8a9a93;padding:6px 10px;min-width:60px}.rt img{max-width:100%}
.q-text{background:#fff;color:#14201b;border-radius:10px;padding:10px 14px;margin:12px 0;min-height:46px;border:1px solid var(--line)}
.qc{border-left:4px solid var(--pri)}.qn{width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--hi);display:inline-grid;place-items:center;font-weight:700;font-size:12px}
.opt{display:flex;gap:10px;align-items:center;margin:7px 0}
.hist{display:flex;align-items:flex-end;gap:8px;height:150px;margin:14px 0 6px;padding-top:18px}.hb{flex:1;background:linear-gradient(180deg,var(--hi),var(--pri));border-radius:6px 6px 0 0;position:relative;min-height:3px;opacity:.9}.hb span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.hl{display:flex;gap:8px;font-size:10px;color:var(--mut)}.hl span{flex:1;text-align:center}
.bar2{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:90px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--hi))}
.band{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.band.top{background:var(--soft);color:var(--hi)}.band.mid{background:var(--warnbg);color:var(--warn)}.band.help{background:rgba(255,120,120,.14);color:var(--err)}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--hi));transition:width .3s}
.exb{display:flex;gap:18px;max-width:1040px;margin:0 auto;padding:20px}#nv{width:164px;flex:none;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;position:sticky;top:84px;height:max-content}
#nv button{width:42px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:600}#nv .done{background:var(--soft);border-color:var(--pri);color:var(--hi)}#nv .cur{outline:2px solid var(--hi)}
#qv{flex:1;min-width:0}.ch{display:flex;gap:12px;align-items:center;padding:13px 15px;margin:9px 0;border:1.5px solid var(--line);border-radius:13px;cursor:pointer;background:var(--card);transition:.12s}.ch:hover{border-color:var(--pri2)}.ch:has(input:checked){border-color:var(--hi);background:var(--soft)}
.qt{background:#fff;color:#14201b;border-radius:12px;padding:14px 16px;margin:10px 0;font-size:16px}.timer{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font:700 16px ui-monospace,Menlo,monospace}.timer.low{color:var(--err);border-color:var(--err)}
details.doc{margin-bottom:14px}details.doc summary{cursor:pointer;margin-bottom:8px;font-weight:600}
.err{color:var(--err);min-height:18px;font-size:13px}.ok{color:var(--hi)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);padding:11px 18px;border-radius:12px;background:var(--soft);color:var(--hi);border:1px solid var(--pri);opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:92vw;box-shadow:var(--sh);font-weight:500}#toast.on{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--warnbg);color:var(--err);border-color:var(--err)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.narrow{width:100%;max-width:410px}
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}.brandp{position:relative;overflow:hidden;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:18px;background:radial-gradient(700px 420px at 20% 10%,rgba(92,255,176,.22),transparent 60%),linear-gradient(160deg,#0B6B4F,#073d2d 70%);color:#fff}
.brandp h2{font-size:30px;line-height:1.2;margin:0}.brandp ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}.brandp li{display:flex;gap:10px;align-items:center;opacity:.95}.brandp li:before{content:"✓";width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:12px;flex:none}
.formp{display:flex;align-items:center;justify-content:center;padding:28px}.formp .card{box-shadow:var(--sh)}
.lnav{display:flex;align-items:center;gap:8px}
.hero{text-align:center;padding:70px 20px 36px;max-width:860px;margin:0 auto;position:relative}.hero:before{content:"";position:absolute;inset:-60px 0 auto;height:340px;background:radial-gradient(520px 260px at 50% 0,rgba(92,255,176,.16),transparent 70%);z-index:-1}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.15;margin:0 0 16px;background:linear-gradient(135deg,var(--fg),var(--hi));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{font-size:17px;max-width:640px;margin:0 auto 22px}
.mockp{max-width:760px;margin:30px auto 0;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);text-align:left}.mockp .r{display:flex;gap:10px;margin-bottom:14px}.mockp .r div{flex:1;height:54px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.mockp .b{display:flex;align-items:flex-end;gap:8px;height:110px}.mockp .b i{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--hi),var(--pri))}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.grid .card{margin:0}.grid .kic{margin-bottom:12px}
.sec{text-align:center;margin:44px 0 18px;font-size:26px}.steps{counter-reset:s}.steps .card:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;font-weight:700;margin-bottom:10px}
.price{position:relative}.price ul{padding-left:18px;margin:0 0 16px;line-height:1.9}.price.hot{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi),var(--sh)}.rib{position:absolute;top:-11px;right:16px;background:var(--hi);color:#06281c;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px}
.foot{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--mut);margin-top:40px}
@media(max-width:860px){.auth{grid-template-columns:1fr}.brandp{display:none}}
@media(max-width:720px){.exb{flex-direction:column}#nv{width:100%;position:static}.paper{padding:22px}.nav span,.chip .nm{display:none}.bar{padding:0 12px;gap:6px}.navs{margin-left:4px}.wrap{padding:16px 12px 50px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="v"></div><div id="toast" role="status"></div>
<script src="config.js"></script><script src="api.js"></script><script src="i18n.js"></script><script src="app.js"></script></body></html>
