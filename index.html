<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OZAQ — mock testlar va analitika</title>
<style>
:root{--bg:#0F1412;--card:#1B2420;--line:#263029;--fg:#E8F0EC;--mut:#93A39B;--pri:#0B6B4F;--hi:#5CFFB0;--err:#FF8A8A;--warn:#F5C451}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--hi)}
.logo{font-weight:800;font-size:20px;letter-spacing:.04em}.logo i{color:var(--hi);font-style:normal}
.bar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#161D1A;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.sp{flex:1}.mut{color:var(--mut)}.wrap{max-width:1000px;margin:0 auto;padding:20px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.card h3{margin:0 0 10px;font-size:15px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 420px at 50% -10%,#12392d,var(--bg) 70%)}.narrow{width:100%;max-width:400px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#121a16}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri)}input[type=radio],input[type=checkbox]{width:auto}
input.num{width:70px}textarea{min-height:100px}
.btn{padding:9px 15px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:700}.btn:hover{background:#0d7f5d}
.btn.s{padding:5px 10px;font-size:12px;font-weight:600;background:transparent;border:1px solid var(--line)}.btn.s:hover{background:var(--line)}.btn.w{width:100%;margin-top:14px}.btn[disabled]{opacity:.5}
.pill,.badge{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#0f3a2c;color:var(--hi)}
.b-draft{background:#2a3350;color:#9db4ff}.b-published{background:#3a3320;color:var(--warn)}.b-closed{background:#3d2323;color:var(--err)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.kpis .card{margin:0}.kpis b{font-size:26px;display:block}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:transparent}.tabs .on{background:var(--pri);border-color:var(--pri);color:#fff}
.ti{font-size:18px;font-weight:700;max-width:420px}.note{padding:10px 12px;border-radius:10px;background:#2a2410;color:var(--warn);margin-bottom:12px}
.tool{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.paper{background:#fff;color:#111;max-width:794px;min-height:200px;margin:0 auto 18px;padding:36px 44px;border-radius:4px;box-shadow:0 6px 30px rgba(0,0,0,.4);outline:0}
.rt table{border-collapse:collapse;margin:8px 0}.rt td,.rt th{border:1px solid #888;padding:6px 10px;min-width:60px}.rt img{max-width:100%}
.q-text{background:#fff;color:#111;border-radius:8px;padding:10px 12px;margin:10px 0;min-height:44px}
.opt{display:flex;gap:8px;align-items:center;margin:6px 0}
.hist{display:flex;align-items:flex-end;gap:6px;height:130px;margin:8px 0}.hb{flex:1;background:var(--pri);border-radius:4px 4px 0 0;position:relative;min-height:3px}.hb span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.hl{display:flex;gap:6px;font-size:10px;color:var(--mut)}.hl span{flex:1;text-align:center}
.exb{display:flex;gap:16px;max-width:1000px;margin:0 auto;padding:16px}#nv{width:150px;flex:none;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
#nv button{width:40px;height:36px;border:1px solid var(--line);border-radius:8px;background:transparent}#nv .done{background:#0f3a2c;border-color:var(--pri)}#nv .cur{outline:2px solid var(--hi)}
#qv{flex:1;min-width:0}.ch{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:8px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer}.ch:hover{background:#222d28}
.qt{background:#fff;color:#111;border-radius:8px;padding:12px 14px;margin:8px 0}.timer{font:700 18px ui-monospace,monospace}.timer.low{color:var(--err)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:#0f3a2c;color:#fff;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}#toast.on{opacity:1}#toast.bad{background:#4a1f1f}
.err{color:var(--err);min-height:18px}details.doc{margin-bottom:12px}details.doc summary{cursor:pointer;margin-bottom:8px}
@media(max-width:720px){.exb{flex-direction:column}#nv{width:100%}.paper{padding:20px}}
</style></head><body><div id="v"></div><div id="toast" role="status"></div>
<script src="config.js"></script><script src="api.js"></script><script src="app.js"></script></body></html>
